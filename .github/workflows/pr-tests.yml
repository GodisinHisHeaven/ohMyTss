name: Temporary Release interaction gate
'on':
  workflow_dispatch:
permissions:
  actions: read
concurrency:
  group: synthetic-release-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-gate:
    runs-on: xcode-27
    timeout-minutes: 100
    name: Synthetic Release upgrade and interactions
    steps:
      - name: Check isolated runner and run synthetic gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'GodisinHisHeaven/ohMyTss' ]]
          [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' && "$RUNNER_OS" == 'macOS' ]]
          [[ "$RUNNER_TEMP" == /Users/runner/work/* && "$GITHUB_WORKSPACE" == /Users/runner/work/* ]]
          mkdir -p "$RUNNER_TEMP/release-gate-results"
          curl --fail --silent --show-error --retry 3 -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > "$RUNNER_TEMP/release-gate-results/jobs.json"
          unset GH_TOKEN
          python3 - "$RUNNER_TEMP/release-gate-results/jobs.json" "$RUNNER_NAME" <<'PY'
          import json, sys
          jobs=json.load(open(sys.argv[1], encoding='utf-8')).get('jobs', [])
          matches=[x for x in jobs if x.get('name')=='Synthetic Release upgrade and interactions' and x.get('runner_name')==sys.argv[2]]
          if len(matches)!=1 or matches[0].get('runner_group_name')!='GitHub Actions':
              raise SystemExit('Runner is not the isolated GitHub-hosted job')
          print('Verified hosted job:', matches[0]['runner_name'])
          PY
          git clone --quiet --no-checkout "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/gate-repository"
          git -C "$RUNNER_TEMP/gate-repository" fetch --quiet origin "$GITHUB_SHA"
          [[ "$(git -C "$RUNNER_TEMP/gate-repository" rev-parse "$GITHUB_SHA^1")" == 4560edef02cdd1094b4f20acc0c6d12482a13005 ]]
          git -C "$RUNNER_TEMP/gate-repository" show "$GITHUB_SHA:scripts/synthetic-release-gate.sh" > "$RUNNER_TEMP/synthetic-release-gate.sh"
          bash "$RUNNER_TEMP/synthetic-release-gate.sh"
      - name: Upload synthetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-release-interaction-results
          path: ${{ runner.temp }}/release-gate-results
          if-no-files-found: warn
          retention-days: 7
