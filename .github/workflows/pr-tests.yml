name: Temporary synthetic physical-device build
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-build:
    name: Build isolated diagnostic app
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate isolation and build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          [[ "$(git rev-parse HEAD^1)" == 7b94aa6184d29bb5b55ba7d6d04a7fba824b8c57 ]]
          git diff --exit-code HEAD^1 HEAD -- \
            onMyTss/onMyTss/Views/V2/V2ActivityDetailView.swift \
            onMyTss/onMyTss/Services/WorkoutSourceMatching.swift \
            onMyTss/onMyTss/Services/DataStore.swift \
            onMyTss/onMyTss/Services/WorkoutAggregator.swift
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          entitlements=plistlib.loads(Path('onMyTss/onMyTss/onMyTss.entitlements').read_bytes())
          info=plistlib.loads(Path('onMyTss/Config/AppInfo.plist').read_bytes())
          assert not entitlements
          assert info['CFBundleDisplayName']=='ohMyTss Lab'
          assert not any(k in info for k in ('CFBundleURLTypes','UIBackgroundModes','BGTaskSchedulerPermittedIdentifiers'))
          print('Diagnostic has no HealthKit, App Group, callback scheme, or background entitlement')
          PY
          umask 077
          printf '%s\n' 'STRAVA_CLIENT_ID = 123456' 'STRAVA_CLIENT_SECRET = CI_SYNTHETIC_ONLY' > onMyTss/Config/Secrets.xcconfig
          xcodebuild build -project onMyTss/onMyTss.xcodeproj -scheme onMyTss \
            -configuration Release -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/diagnostic-derived" -jobs 1 \
            CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            PRODUCT_BUNDLE_IDENTIFIER=mj6.codex.ohmytssdiagnostic > "$RUNNER_TEMP/device-build.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/device-build.log"; exit 1;
            }
          app="$RUNNER_TEMP/diagnostic-derived/Build/Products/Release-iphoneos/onMyTss.app"
          [[ -x "$app/onMyTss" && ! -d "$app/PlugIns" ]]
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" | grep -Fx 'mj6.codex.ohmytssdiagnostic'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist" | grep -Fx 'ohMyTss Lab'
          ! /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$app/Info.plist" >/dev/null 2>&1
          shasum -a 256 "$app/onMyTss" > "$RUNNER_TEMP/device-binary.sha256"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ohmytss-device-diagnostic.zip"
      - name: Upload isolated app and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-device-diagnostic
          path: |
            ${{ runner.temp }}/ohmytss-device-diagnostic.zip
            ${{ runner.temp }}/device-binary.sha256
            ${{ runner.temp }}/device-build.log
          if-no-files-found: warn
          retention-days: 2
