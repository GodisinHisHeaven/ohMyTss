name: Temporary TestFlight release inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: Read TestFlight build inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify trusted source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'GodisinHisHeaven/ohMyTss' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD^1)" == '7b94aa6184d29bb5b55ba7d6d04a7fba824b8c57' ]]
          [[ "$(git diff --name-only HEAD^1 HEAD | LC_ALL=C sort)" == $'.github/workflows/pr-tests.yml\nscripts/asc_release_inventory.py' ]]
      - name: Read build and internal group status
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/asc_release_inventory.py
