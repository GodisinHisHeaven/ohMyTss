name: Temporary synthetic performance diagnostic
'on':
  workflow_dispatch:
permissions:
  actions: read
concurrency:
  group: synthetic-perf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Synthetic Release A B B A
    runs-on: xcode-27
    timeout-minutes: 100
    steps:
      - name: Verify isolated hosted runner and fetch diagnostic commit anonymously
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'GodisinHisHeaven/ohMyTss' ]]
          [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' ]]
          [[ "$RUNNER_OS" == 'macOS' ]]
          [[ "$RUNNER_TEMP" == /Users/runner/work/* ]]
          [[ "$GITHUB_WORKSPACE" == /Users/runner/work/* ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/perf-results"
          curl --fail --silent --show-error --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > "$RUNNER_TEMP/perf-results/jobs.json"
          unset GH_TOKEN
          python3 - "$RUNNER_TEMP/perf-results/jobs.json" "$RUNNER_NAME" <<'PY'
          import json, sys
          jobs = json.load(open(sys.argv[1], encoding='utf-8')).get('jobs', [])
          matched = [j for j in jobs if j.get('name') == 'Synthetic Release A B B A'
                     and j.get('runner_name') == sys.argv[2]]
          if len(matched) != 1 or matched[0].get('runner_group_name') != 'GitHub Actions':
              raise SystemExit('Not an identified GitHub-hosted job; abort before simulator access')
          print('Verified hosted job:', matched[0]['runner_name'], matched[0]['runner_group_name'])
          PY
          git clone --quiet --no-checkout "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/perf-repository"
          git -C "$RUNNER_TEMP/perf-repository" fetch --quiet origin "$GITHUB_SHA"
          [[ "$(git -C "$RUNNER_TEMP/perf-repository" rev-parse "$GITHUB_SHA^{commit}")" == "$GITHUB_SHA" ]]
          [[ "$(git -C "$RUNNER_TEMP/perf-repository" rev-parse "$GITHUB_SHA^1")" == 4560edef02cdd1094b4f20acc0c6d12482a13005 ]]
          git -C "$RUNNER_TEMP/perf-repository" show "$GITHUB_SHA:scripts/temporary-release-ab.sh" > "$RUNNER_TEMP/temporary-release-ab.sh"
          bash "$RUNNER_TEMP/temporary-release-ab.sh"
      - name: Upload synthetic logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-performance-results
          path: ${{ runner.temp }}/perf-results
          if-no-files-found: warn
          retention-days: 7
