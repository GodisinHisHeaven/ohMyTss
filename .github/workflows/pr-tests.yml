name: Temporary zero-simulator migration validation
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    name: SwiftData migration without a simulator
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and run migrations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          [[ "$(git rev-parse HEAD^1)" == b77f0fa8fb96a82cfd7cd079bb71c6af4bb56d79 ]]
          git diff --exit-code HEAD^1 HEAD -- onMyTss/onMyTss/Models onMyTss/onMyTss/Domain docs/v2/fixtures scripts/check_v2_migration.sh scripts/check_rpe_migration.sh
          assert_no_booted_simulators() {
            xcrun simctl list devices --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; rows=[x["udid"] for g in d.values() for x in g if x.get("state")=="Booted"]; print("Booted simulators:",len(rows)); assert not rows'
          }
          assert_no_booted_simulators
          mkdir -p "$RUNNER_TEMP/migration-results"
          export PATH='/usr/bin:/bin:/usr/sbin:/sbin'
          if command -v rg >/dev/null 2>&1; then
            echo 'Unexpected rg in the isolated PATH' >&2
            exit 1
          fi
          echo 'Verified rg is unavailable in the isolated PATH'
          xcodebuild -version | tee "$RUNNER_TEMP/migration-results/xcode.txt"
          bash scripts/check_v2_migration.sh 2>&1 | tee "$RUNNER_TEMP/migration-results/v2.log"
          bash scripts/check_rpe_migration.sh 2>&1 | tee "$RUNNER_TEMP/migration-results/rpe.log"
          assert_no_booted_simulators
      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-simulator-migration-results
          path: ${{ runner.temp }}/migration-results
          if-no-files-found: warn
          retention-days: 14
