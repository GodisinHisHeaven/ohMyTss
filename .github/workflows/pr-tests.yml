name: Temporary direct TestFlight verification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read the target group, or distribute the verified Build 43
        type: choice
        options: [inspect, inspect_existing, distribute]
        default: inspect
        required: true
permissions:
  contents: read
jobs:
  verify:
    name: Verify direct TestFlight Build 43
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trusted code and exact main tree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'GodisinHisHeaven/ohMyTss' ]]
          [[ "$GITHUB_REF" == 'refs/heads/codex/temporary-direct-testflight-check' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD^1)" == '7e58715ec391dbd2ea236ac5e0e9a3820e851785' ]]
          [[ "$(git rev-parse HEAD^1^{tree})" == '91f2e5018c98a634357af05e15c5acc43e8aa038' ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == '7e58715ec391dbd2ea236ac5e0e9a3820e851785' ]]
          [[ "$(git diff --name-only HEAD^1 HEAD | LC_ALL=C sort)" == $'.github/workflows/pr-tests.yml\nscripts/tests/test_verify_direct_testflight.py\nscripts/verify_direct_testflight.py' ]]
      - name: Test verification safeguards
        run: python3 -B -m unittest scripts.tests.test_verify_direct_testflight -v
      - name: Check or distribute the exact internal build
        if: ${{ inputs.mode != 'inspect_existing' }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERIFY_MODE: ${{ inputs.mode }}
        run: python3 scripts/verify_direct_testflight.py
      - name: Verify a previously distributed build read-only
        if: ${{ inputs.mode == 'inspect_existing' }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, time
          sys.path.insert(0, 'scripts')
          import verify_direct_testflight as d
          d.BUILD = '42'
          d.current_main()
          client = d.Client(*(os.environ[n] for n in ('ASC_ISSUER_ID','ASC_KEY_ID','ASC_PRIVATE_KEY')),
                            deadline=time.monotonic() + 300)
          rows = [row for row in client.all('/v1/apps/' + d.APP + '/builds?limit=200')
                  if d.attributes(row).get('version') == '42']
          for row in rows:
              details = d.attributes(client.get('/v1/builds/' + d.safe_id(row)).get('data'))
              print('Existing Build 42 audience:', details.get('buildAudienceType'),
                    'processing:', details.get('processingState'), 'expired:', details.get('expired'))
          state = d.read_state(client, required_audience='APP_STORE_ELIGIBLE')
          if not state['build'] or not state['linked'] or state['state'] != 'IN_BETA_TESTING':
              raise SystemExit('Previously distributed internal build is not currently verified')
          print('Existing internal Build 42 verified through App Store Connect API')
          PY
