name: Intensity UI targeted retest

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retest:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare synthetic configuration
        shell: bash
        run: |
          set -euo pipefail
          config=onMyTss/Config/Secrets.xcconfig
          umask 077
          printf '%s\n' 'STRAVA_CLIENT_ID = 123456' 'STRAVA_CLIENT_SECRET = CI_SYNTHETIC_ONLY' > "$config"

      - name: Select one available simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          choices = []
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"\.iOS-(\d+)-(\d+)$", runtime)
              if not match or tuple(map(int, match.groups())) < (26, 1):
                  continue
              for device in devices:
                  name, udid = device.get("name", ""), device.get("udid", "")
                  if device.get("isAvailable") and name == "iPhone 18 Pro" and tuple(map(int, match.groups())) == (27, 0) and re.fullmatch(r"[0-9A-Fa-f-]{36}", udid):
                      choices.append((tuple(map(int, match.groups())), name == "iPhone 17 Pro", name, udid))
          if not choices:
              raise SystemExit("No available iPhone 18 Pro with iOS 27.0")
          version, _, name, udid = max(choices)
          print(f"destination=platform=iOS Simulator,id={udid}")
          print(f"udid={udid}")
          print(f"Selected {name}, iOS {version[0]}.{version[1]}", file=sys.stderr)
          PY

      - name: Boot the selected simulator
        timeout-minutes: 8
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run the intensity UI test and check for animation stalls
        timeout-minutes: 18
        shell: bash
        env:
          TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -euo pipefail
          for iteration in 1; do
            result="$RUNNER_TEMP/intensity-ui-$iteration.xcresult"
            xcodebuild test -project onMyTss/onMyTss.xcodeproj -scheme onMyTss \
              -destination "$TEST_DESTINATION" -derivedDataPath "$RUNNER_TEMP/derived" \
              -resultBundlePath "$result" -parallel-testing-enabled NO \
              -only-testing:onMyTssUITests/V2FlowTests/testIntensityThresholdsShowCompactDistribution \
              CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/intensity-ui-$iteration.log" 2>&1
            python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(); n=s.count("App animations complete notification not received"); print("Animation idle timeouts:",n); sys.exit(n != 0)' "$RUNNER_TEMP/intensity-ui-$iteration.log"
            xcrun xcresulttool get test-results summary --path "$result" --format json | python3 -c \
              'import json,sys; d=json.load(sys.stdin); print("passed:",d["passedTests"],"failed:",d["failedTests"],"skipped:",d["skippedTests"]); assert d["passedTests"] == 1 and d["failedTests"] == 0 and d["skippedTests"] == 0'
          done

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-intensity-ui-retest
          path: |
            ${{ runner.temp }}/intensity-ui-*.xcresult
            ${{ runner.temp }}/intensity-ui-*.log
          if-no-files-found: warn
          retention-days: 7
