name: Start current main from historical Cloud run

on:
  workflow_dispatch:
    inputs:
      historical_canceled_run_id:
        description: "Canceled main-branch Cloud run ID from a verified ancestor"
        required: true
        type: string
      confirm_start:
        description: "Start one current-main Cloud run after all safety checks"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  start-and-verify:
    name: Start and verify exact TestFlight build
    runs-on: ubuntu-latest
    timeout-minutes: 105
    concurrency:
      group: testflight-cloud-recovery
      cancel-in-progress: false
    steps:
      - name: Require explicit protected-main dispatch
        shell: bash
        env:
          CONFIRM_START: ${{ inputs.confirm_start }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == GodisinHisHeaven/ohMyTss ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$CONFIRM_START" == true ]]

      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Start one current-main Cloud build
        id: cloud_start
        env:
          GH_READ_TOKEN: ${{ github.token }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6755509363' }}
          TARGET_SHA: ${{ github.sha }}
          HISTORICAL_RUN_ID: ${{ inputs.historical_canceled_run_id }}
          CONFIRM_START: ${{ inputs.confirm_start }}
        run: python3 scripts/start_main_from_historical_run.py

      - name: Verify Xcode Cloud and TestFlight
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6755509363' }}
          ASC_BETA_GROUP: ${{ vars.ASC_BETA_GROUP || 'close door' }}
          TARGET_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ steps.cloud_start.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$EXPECTED_RUN_ID" ]]
          python3 scripts/verify_testflight.py --commit "$TARGET_SHA" \
            --expected-run-id "$EXPECTED_RUN_ID" --timeout-seconds 5400 --poll-seconds 30
