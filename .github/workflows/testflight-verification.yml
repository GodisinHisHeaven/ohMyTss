name: Verify TestFlight distribution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full main-branch commit SHA to verify"
        required: false
        type: string
      retry_canceled_cloud_run:
        description: "Start one replacement for a canceled current-main Cloud run"
        required: true
        type: boolean
        default: false
      canceled_run_id:
        description: "Canceled Xcode Cloud run ID; required only for retry"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact TestFlight build
    runs-on: ubuntu-latest
    timeout-minutes: 105
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_canceled_cloud_run && 'testflight-cloud-recovery' || github.run_id }}
      cancel-in-progress: false
    steps:
      # Secrets are not exposed to this step, or to pull request workflows.
      - name: Require the protected main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must run from main." >&2
            exit 1
          fi

      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the commit to verify
        id: target
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          target="${REQUESTED_SHA:-$GITHUB_SHA}"
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The target must be a full lowercase Git commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] || ! git merge-base --is-ancestor "$target" "$GITHUB_SHA"; then
            echo "The target is not reachable from this main-branch run." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$target" >> "$GITHUB_OUTPUT"

      # This write-capable step is available only on explicit main dispatch.
      # It performs one POST at most; uncertain outcomes must be investigated.
      - name: Retry canceled Xcode Cloud run
        id: cloud_retry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_canceled_cloud_run == true }}
        env:
          GH_READ_TOKEN: ${{ github.token }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6755509363' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CANCELED_RUN_ID: ${{ inputs.canceled_run_id }}
        run: python3 scripts/retry_canceled_cloud_run.py

      # Verification is unchanged and remains mandatory after an explicit retry.
      # A missing key is a failure, never a successful or skipped check.
      - name: Verify Xcode Cloud and TestFlight
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6755509363' }}
          ASC_BETA_GROUP: ${{ vars.ASC_BETA_GROUP || 'close door' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EXPECTED_RUN_ID: ${{ steps.cloud_retry.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--timeout-seconds 5400 --poll-seconds 30)
          if [[ -n "$EXPECTED_RUN_ID" ]]; then
            args+=(--expected-run-id "$EXPECTED_RUN_ID")
          fi
          python3 scripts/verify_testflight.py --commit "$TARGET_SHA" "${args[@]}"
